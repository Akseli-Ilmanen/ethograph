[project]
name = "ethograph"
authors = [{name = "Akseli Ilmanen", email = "akseli.ilmanen@gmail.com"}]
description = "A multimodal timeseries GUI for neuroethology"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

# Core dependencies — TrialTree, I/O, features, labels, and CLI
dependencies = [
    # Upper bound is numba's, reached through pynapple: numba refuses to import
    # against a newer numpy, which takes the whole package down at import time.
    "numpy<2.5",
    "pandas",
    "xarray",
    "netcdf4",
    "scipy",
    # scikit-learn: the LightGBM-style onset detector (labels/onset_model.py).
    # joblib is sklearn's own dependency but we import it directly to store
    # trained bundles.
    "scikit-learn",
    "joblib",
    "matplotlib",
    "pynapple>=0.10",
    "pyyaml",
    "crowsetta",
    "pynwb",
    "h5py",
]

[project.urls]
"Homepage" = "https://github.com/Akseli-Ilmanen/ethograph"
"Bug Tracker" = "https://github.com/Akseli-Ilmanen/ethograph/issues"
"Documentation" = "https://Akseli-Ilmanen.github.io/ethograph"
"Source Code" = "https://github.com/Akseli-Ilmanen/ethograph"
"User Support" = "https://github.com/Akseli-Ilmanen/ethograph/issues"

[project.scripts]
ethograph = "ethograph.cli:main"

[project.gui-scripts]
ethograph-gui = "ethograph.cli:launch"

[project.optional-dependencies]


# GUI: standalone pygfx/pyqtgraph graphical interface with all plot types (no audio)
gui = [
    "PyQt6",
    "qtpy",
    "pyqtgraph",
    "PyOpenGL",
    "pygfx>=0.15.3",
    "pynaviz>=0.1",
    "rendercanvas",
    "wgpu",
    "av>=12",
    "movement>=0.14",
    "ruptures",
    "jinja2",
    "natsort",
    "tqdm",
    "nwb-video-widgets",
    "phylib>=2.6.4",
    "neo",
    # Keypoint labelling: the optical-flow fill backend, and rendering the tag
    # sheet. Headless because plain opencv-python ships Qt plugins that conflict
    # with PyQt6; contrib because cv2.aruco is not in the base wheel.
    "opencv-contrib-python-headless",
    # Reading tag36h11 markers on the Detect tab (AprilTag 3).
    "pupil-apriltags",
]

# Audio: waveform display, spectrogram, vocalisation analysis
# Linux users must first install the PortAudio system library:
#   sudo apt install libportaudio2
audio = [
    "audioio",
    "soundfile",
    "vocalpy",
    "sounddevice",
    # deps for the vendored vocalseg segmentation (ethograph/_vendor/vocalseg)
    "librosa",
    "tqdm",
]

# DANDI: download datasets from the DANDI archive (heavy: ~40 transitive deps)
dandi = [
    "dandi",
]

# Proxy generation: faster scrubbing in long videos (optional)
proxy = [
    "imageio-ffmpeg",
]


# Segmentation pipeline (ethograph.segment) + S3D video features
# (ethograph.video_features). torch/torchvision are deliberately excluded —
# install a CUDA-matched build first (see docs), otherwise pip may replace it
# with a CPU-only wheel.
model = [
    "tqdm",
    "movement>=0.14",
    "av>=12",
    # Used by the vendored DLC2Action MotionBERT model
    # (ethograph/segment/dlc2action/model/motionbert.py); upstream requires it too.
    "einops",
    # Hyperparameter search (ethograph/segment/search.py): the study is scored
    # on the validation split and stored in searches/{name}/study.db, so a
    # search resumes rather than restarting.
    "optuna",
]

# Frame-wise video features (ethograph/video_features/timm_extract.py,
# `video_features.extractor: timm`): any timm image backbone, DINOv2 by
# default. Depends on torch, so install the CUDA build first (above).
timm = [
    "timm>=1.0",
]

# PosePAL fill backend for pose keypoints (CoTracker3 + query-feature
# refinement, see ethograph/gui/pose_refine.py).
#
#   uv pip install --torch-backend=auto torch \
#     "cotracker @ git+https://github.com/facebookresearch/co-tracker.git@82e02e8029753ad4ef13cf06be7f4fc5facdda4d"
#
# --torch-backend=auto matters: PyPI's Windows torch wheels are CPU-only, so a
# GPU is otherwise silently ignored. The ~97 MB CoTracker weights then download
# on first use (see pose_fill.download_cotracker_checkpoint).
#

# OCTRON headless core (ethograph.segment multi-animal masks/boxes/tracks):
# SAM2/SAM3 segmentation, YOLO training/prediction and BoxMOT tracking without
# napari/Qt. Installed from the fork until upstream merges the `gui` extra
# split (OCTRON-tracking/OCTRON-GUI#87). Needs Python <3.13 and, like `model`,
# expects a CUDA-matched torch to be installed first. Note the pinned boxmot
# wheel caps pandas<3 and opencv-python<5.
octron = [
    "octron @ git+https://github.com/Akseli-Ilmanen/OCTRON-GUI@main",
]

# Development
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "coverage",
    "tox",
    "pre-commit",
    "ruff",
    "setuptools-scm",
]

# Documentation
docs = [
    "sphinx",
    "sphinx-autobuild",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
    "sphinx-sitemap",
    "sphinx-design",
    "myst-nb",
    "linkify-it-py",
    "setuptools-scm",
]


[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ethograph*"]
exclude = ["tests", "docs*"]

[tool.setuptools.package-data]
"ethograph.gui" = ["*.yaml", "assets/templates/*", "assets/wizard/*", "templates/*.j2", "templates/notebook/*"]
ethograph = ["assets/*", "defaults/*", "defaults/**/*"]
"ethograph._vendor.vocalseg" = ["LICENSE", "NOTICE.md"]
# The architectures read their defaults from these at build time — see NOTICE.md.
"ethograph.segment.models" = ["config/*.yaml"]
"ethograph.segment.dlc2action" = ["config/**/*.yaml", "NOTICE.md", "LICENSE.APGPL", "colors.txt"]
"ethograph.segment.specscalpel" = ["config/*.yaml", "NOTICE.md", "LICENSE"]
"ethograph.segment.lady" = ["config/*.yaml", "NOTICE.md", "LICENSE"]

[tool.setuptools.exclude-package-data]
"ethograph.video_features" = ["checkpoint/*.pt"]

[tool.setuptools_scm]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]


[tool.pytest.ini_options]
addopts = "--cov=ethograph -m 'not slow'"
testpaths = ["tests"]
norecursedirs = ["pynaviz", "docs", "build", ".git"]
markers = [
    "slow: marks tests that require network access or take >30s (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:Ignoring the following cached namespace:UserWarning",
    "ignore::DeprecationWarning:pynwb",
    "ignore::DeprecationWarning:hdmf",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.check-manifest]
ignore = [
    "*.yaml",
    "*.yml",
    "*.md",
    "*.json",
    "*.model",
    "*.txt",
    "*.ipynb",
    "tox.ini",
    "Usersaksel.pypirc",
    "tests/*",
    "docs/*",
    "configs/*",
    "scripts/*",
    "scripts/**",
    "examples/*",
    "examples/**",
    "ethograph/video_features/checkpoint/*.pt",
    ".claude/*",
]

[tool.ruff]
line-length = 120
exclude = ["__init__.py", "build", ".eggs", "scripts", "ethograph/_vendor", "ethograph/segment/dlc2action", "ethograph/segment/specscalpel", "ethograph/segment/lady", "*.ipynb", ".archive"]
lint.select = [
    "E",
    "F",
    "I",
]
fix = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# Gentle, informational type checking. Run in CI as non-blocking (see
# .github/workflows/test_and_deploy.yml) — it surfaces real type mismatches
# (chiefly "this could be None and you didn't handle it") without demanding
# that every function be annotated. Tighten later if the signal proves useful.
files = ["ethograph"]
exclude = ['ethograph/_vendor/', 'ethograph/segment/dlc2action/', 'ethograph/segment/specscalpel/', 'ethograph/segment/lady/', '/_test_']
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{311,312,313}
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
passenv =
    CI
    GITHUB_ACTIONS
extras =
    dev
commands =
    pytest -v --color=yes --cov=ethograph --cov-report=xml
"""

[tool.codespell]
skip = '.git,*.ipynb,docs/build/*,docs/jupyter_execute/*'
check-hidden = true
ignore-words-list = "eto,ND,buildd"
