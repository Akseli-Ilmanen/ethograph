exclude: 'conf.py'

# Configuring https://pre-commit.ci/
ci:
    autoupdate_schedule: monthly

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-docstring-first
            # PEP 258 attribute docstrings — a string documenting a module-level
            # constant, which Sphinx renders — read as a second module docstring
            # to this hook. dlc2action is vendored and never edited (NOTICE.md).
            exclude: '^(ethograph/segment/|ethograph/_vendor/|tests/test_unit/test_segment_)'
          - id: check-executables-have-shebangs
          - id: check-merge-conflict
          - id: check-toml
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: requirements-txt-fixer
          - id: trailing-whitespace
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.4
      hooks:
        - id: ruff
          args: [ --config=pyproject.toml ]
        - id: ruff-format
          args: [ --config=pyproject.toml ]
    - repo: https://github.com/mgedmin/check-manifest
      rev: "0.50"
      hooks:
          - id: check-manifest
            args: [--no-build-isolation]
            additional_dependencies:
              - setuptools>=77
              - wheel
              - setuptools-scm[toml]>=8
    - repo: https://github.com/codespell-project/codespell
      # Configuration for codespell is in pyproject.toml
      rev: v2.4.1
      hooks:
      - id: codespell
        args: [--write-changes]
        exclude: '^ethograph/_vendor/'
        additional_dependencies:
        - tomli
