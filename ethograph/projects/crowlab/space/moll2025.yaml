# Reference geometry for the Moll et al., 2025 crow tool-use setup.
# Points are 3D [x, y, z] in metres. Edges connect points by index.

references:
  - name: setup
    vertices:
      - [-7.00,  0.00, 0.65]   # 0: floor front-left
      - [-7.00,  9.80, 0.65]   # 1: floor back-left
      - [ 6.80,  9.80, 0.65]   # 2: floor back-right
      - [ 6.80,  0.00, 0.65]   # 3: floor front-right
      - [-7.00,  0.00, 2.75]   # 4: ceiling front-left
      - [-7.00,  9.80, 2.75]   # 5: ceiling back-left
      - [ 6.80,  9.80, 2.75]   # 6: ceiling back-right
      - [ 6.80,  0.00, 2.75]   # 7: ceiling front-right
    edges:
      - [0, 1]
      - [1, 2]
      - [2, 3]
      - [3, 0]
      - [4, 5]
      - [5, 6]
      - [6, 7]
      - [7, 4]
      - [0, 4]
      - [1, 5]
      - [2, 6]
      - [3, 7]
    color: black
